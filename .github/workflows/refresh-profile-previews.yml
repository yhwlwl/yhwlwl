name: Refresh profile previews

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-profile-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build preview images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"

          cat > /tmp/score-preview.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><style>
          html,body{margin:0;background:#fff;width:100%;height:100%}
          body{display:flex;align-items:flex-start;justify-content:center}
          img{display:block;width:1200px;max-width:100%;height:auto}
          </style></head><body>
          <img src="https://raw.githubusercontent.com/yhwlwl/score-tracker/main/docs/images/01-score-trend.webp" alt="Score Tracker">
          </body></html>
          HTML
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1200,760 --virtual-time-budget=5000 --screenshot=images/score-tracker.png "file:///tmp/score-preview.html"

          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,900 --virtual-time-budget=7000 --screenshot=images/cdqzsta-website.png "https://www.stacdqz.tech/"

      - name: Commit previews
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/score-tracker.png images/cdqzsta-website.png
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "Refresh profile preview images"
          git push
