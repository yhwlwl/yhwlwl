name: Validate profile previews

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-profile-previews.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze images
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          for path in ['images/score-tracker.png','images/cdqzsta-website.png']:
              im=Image.open(path).convert('RGB')
              pix=list(im.getdata())
              nonwhite=sum(1 for p in pix if min(p)<245)
              print(path, im.size, 'nonwhite_ratio=', nonwhite/len(pix), 'bbox=', Image.eval(im, lambda x: 255-x).getbbox())
          PY
