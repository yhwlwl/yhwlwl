name: GitHub code change metrics

on:
  schedule:
    - cron: "25 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  lines-of-code:
    runs-on: ubuntu-latest
    steps:
      - name: Generate code change statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: yhwlwl
          filename: metrics.plugin.lines.svg
          base: repositories
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 2
          plugin_lines_delay: 30
