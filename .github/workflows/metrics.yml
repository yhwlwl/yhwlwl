name: GitHub code change metrics

on:
  schedule:
    - cron: "25 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/render_code_changes.py"

permissions:
  contents: write

concurrency:
  group: github-profile-code-metrics
  cancel-in-progress: false

jobs:
  lines-of-code:
    runs-on: ubuntu-latest
    steps:
      - name: Generate real code change statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yhwlwl
          filename: metrics.plugin.lines.svg
          output_action: none
          base: repositories
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 2
          plugin_lines_delay: 30

      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GIF renderer
        run: python -m pip install "Pillow==11.3.0"

      - name: Render animated code change card
        run: |
          cp /metrics_renders/metrics.plugin.lines.svg ./metrics.plugin.lines.svg
          python scripts/render_code_changes.py --input metrics.plugin.lines.svg --output metrics.plugin.lines.gif

      - name: Switch profile to the GIF after generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = 'src="https://raw.githubusercontent.com/yhwlwl/yhwlwl/main/metrics.plugin.lines.svg?v=20261025-1"'
          new = 'src="./metrics.plugin.lines.gif"'
          if new not in text:
              if old not in text:
                  raise RuntimeError('Could not locate existing metrics card in README')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit updated statistics and GIF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md metrics.plugin.lines.svg metrics.plugin.lines.gif
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh animated code metrics [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
